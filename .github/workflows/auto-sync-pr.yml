name: Auto Sync and PR to Upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open Pull Request using GitHub CLI
        env:
          # The built-in GITHUB_TOKEN is scoped to this repo only, so it can't
          # see a different repo owned by another account (Autoraimix/QAPulse)
          # — gh pr create fails with "Could not resolve to a Repository" and
          # the fallback below silently swallowed that every run. UPSTREAM_PAT
          # is a fine-grained PAT from an account with pull-request write
          # access to Autoraimix/QAPulse (Settings → Secrets and variables →
          # Actions on this repo).
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        run: |
          gh pr create \
            --repo "Autoraimix/QAPulse" \
            --head "syamilsamat:main" \
            --base "main" \
            --title "SAS: fix/improve code" \
            --body "Automated code improvement sync from syamil." || echo "PR already exists or no changes to sync."
