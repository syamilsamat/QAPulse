name: Auto Sync and PR to Upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to a sync branch on Autoraimix/QAPulse
        env:
          # The built-in GITHUB_TOKEN is scoped to this repo only, so it can't
          # see a different repo owned by another account (Autoraimix/QAPulse).
          # UPSTREAM_PAT is a PAT from an account with push access there
          # (Settings → Secrets and variables → Actions on this repo).
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/Autoraimix/QAPulse.git" \
            "HEAD:refs/heads/sync/from-syamilsamat" --force

      - name: Open Pull Request using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        run: |
          # `--head owner:branch` (cross-repo) only works when GitHub has a
          # registered fork link between the two repos, which this pair
          # doesn't have — it fails with "Head repository can't be blank" /
          # "not all refs are readable" even with a valid token. Using a
          # same-repo branch (pushed above) as the head sidesteps that: it
          # only needs push access to Autoraimix/QAPulse, not a fork edge.
          gh pr create \
            --repo "Autoraimix/QAPulse" \
            --head "sync/from-syamilsamat" \
            --base "main" \
            --title "SAS: fix/improve code" \
            --body "Automated code improvement sync from syamil." || echo "PR already exists or no changes to sync."
